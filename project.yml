name: Tapline

options:
  bundleIdPrefix: app.tapline
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  postGenCommand: sh Scripts/normalize-xcode-project.sh

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true
    CODE_SIGN_STYLE: Automatic

packages:
  TaplinePackages:
    path: .

targets:
  TaplineiOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/TaplineiOS
    info:
      path: Apps/TaplineiOS/Info.plist
      properties:
        CFBundleDisplayName: Tapline
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Tapline connects only to destinations you configure on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tapline.ios
        PRODUCT_NAME: Tapline
        GENERATE_INFOPLIST_FILE: false
        SUPPORTS_MACCATALYST: false
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: TaplinePackages
        product: CaptureCore
      - package: TaplinePackages
        product: CaptureStore
      - package: TaplinePackages
        product: DeliveryKit
      - package: TaplinePackages
        product: EndpointSecurity
      - target: TaplineWatch

  TaplineWatch:
    type: application
    platform: watchOS
    sources:
      - path: Apps/TaplineWatch
      - path: Apps/TaplineWatchShared
    info:
      path: Apps/TaplineWatch/Info.plist
      properties:
        CFBundleDisplayName: Tapline
        CFBundleURLTypes:
          - CFBundleURLName: app.tapline.ios.watchapp.capture
            CFBundleURLSchemes:
              - tapline
        NSMicrophoneUsageDescription: Tapline records only when you press the visible record button.
        UIBackgroundModes:
          - audio
        WKApplication: true
        WKCompanionAppBundleIdentifier: app.tapline.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tapline.ios.watchapp
        PRODUCT_NAME: Tapline
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "4"
    dependencies:
      - package: TaplinePackages
        product: CaptureCore
      - package: TaplinePackages
        product: WatchCapture
      - target: TaplineWatchWidget
        embed: true

  TaplineWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: Apps/TaplineWatchWidget
    info:
      path: Apps/TaplineWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Tapline capture
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tapline.ios.watchapp.widget
        PRODUCT_NAME: TaplineWatchWidget
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true
